# Baseline (iv): independent PPO (local critic) with reward penalties for limit violations.
extends: ../default.yaml
name: ippo
scenario_set: full
env:
  use_projection: false
  violation_penalty_inr: 50.0   # assumption
agent:
  critic_type: local
training:
  federated: false
  projection_gradient: false
  use_fairness_constraint: false
  use_degradation_constraint: false
