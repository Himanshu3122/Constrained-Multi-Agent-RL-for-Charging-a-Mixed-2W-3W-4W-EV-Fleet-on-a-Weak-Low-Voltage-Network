[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solace"
version = "0.2.0"
description = "SOLACE: solver-grounded, LLM-assisted multi-agent RL for fair, degradation-aware EV charging and V2G on weak distribution networks (research implementation)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "SOLACE authors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "osqp>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
llm = ["transformers>=4.43", "peft>=0.11", "accelerate>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end smoke test (slow, run with -m smoke)"]
addopts = "-m 'not smoke'"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N802", "N803", "N806", "E741", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["solace", "_bootstrap"]
